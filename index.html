<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدينة VR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='8' width='7' height='13' fill='%235b6cff'/%3E%3Crect x='12' y='3' width='8' height='18' fill='%235b6cff'/%3E%3C/svg%3E">
<style>
:root{--bg:#050816;--fg:#e8ecff;--btn:#5b6cff;--btn2:#1c2347;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));pointer-events:none}
#ui>*{pointer-events:auto}
#title{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:15px;opacity:.9;pointer-events:none;text-shadow:0 1px 4px #000}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font:inherit;font-size:15px;color:#fff;background:var(--btn);border:0;border-radius:14px;padding:11px 16px;cursor:pointer}
button.alt{background:var(--btn2);border:1px solid #3a4580}
#msg{font-size:13px;text-align:center;max-width:460px;background:rgba(5,8,22,.55);padding:6px 10px;border-radius:10px}
body.stereo #ui,body.stereo #title{display:none}
#exit{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;z-index:5;padding:8px 16px;font-size:14px}
body.stereo #exit{display:block}
#line{position:fixed;top:0;bottom:0;left:50%;width:2px;background:#000;display:none;transform:translateX(-1px)}
body.stereo #line{display:block}
.ico{width:20px;height:20px;vertical-align:-4px;margin-inline-end:8px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.rnd{padding:12px;border-radius:50%;line-height:0}
button.rnd .ico{margin:0}
#joy{position:fixed;left:24px;bottom:calc(190px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(91,108,255,.15);border:2px solid #3a4580;touch-action:none;display:none;z-index:4}
#knob{position:absolute;width:48px;height:48px;border-radius:50%;background:var(--btn);left:36px;top:36px;pointer-events:none}
#ud{position:fixed;right:24px;bottom:calc(190px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:14px;z-index:4}
body.touch #joy{display:block}
body.touch #ud{display:flex}
#dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.7;display:none;pointer-events:none}
body.stereo #dot{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div><div id="dot"></div>
<div id="joy"><div id="knob"></div></div>
<div id="ud">
  <button id="up" class="alt rnd" aria-label="صعود"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <button id="dn" class="alt rnd" aria-label="نزول"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
</div>
<div id="title">مدينة VR — المس أي شيء للتفاعل معه</div>
<button id="exit" class="alt">خروج</button>
<div id="ui">
  <div id="msg">مبنى: تشغيل/إطفاء الأنوار — سيارة: زمور وتغيير لونها — الأرض: كرة — السماء: ألعاب نارية</div>
  <div class="row">
    <button id="xr" style="display:none"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="4"/><path d="M10 12h4"/><circle cx="7" cy="12" r="1.5"/><circle cx="17" cy="12" r="1.5"/></svg><span id="xrt">دخول VR</span></button>
    <button id="cb" class="alt"><svg class="ico" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>وضع النظارة</button>
    <button id="gy" class="alt"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8l-2 6-6 2 2-6z"/></svg>جيروسكوب</button>
    <button id="dn2" class="alt"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>ليل / نهار</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var canvas=document.getElementById('c'),V3=THREE.Vector3;
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.xr.enabled=true;
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x7ec8ff);
  scene.fog=new THREE.Fog(0x7ec8ff,30,140);
  var rig=new THREE.Group(); scene.add(rig);
  rig.position.set(7,0,46);
  var camera=new THREE.PerspectiveCamera(70,1,0.05,300);
  camera.position.set(0,1.6,0); rig.add(camera);
  var hemi=new THREE.HemisphereLight(0xffffff,0x555566,1); scene.add(hemi);
  var sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(30,50,20); scene.add(sun);

  // ---------- المدينة ----------
  var pick=[],blds=[],cars=[],balls=[],fws=[];
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshStandardMaterial({color:0x23262f,roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.userData.kind='ground'; scene.add(ground); pick.push(ground);
  var lineM=new THREE.MeshBasicMaterial({color:0xd8c24a}),lg=new THREE.PlaneGeometry(112,0.25);
  for(var i=-4;i<4;i++){
    var p=i*14+7,a=new THREE.Mesh(lg,lineM); a.rotation.x=-Math.PI/2; a.position.set(0,0.03,p); scene.add(a);
    var b=new THREE.Mesh(lg,lineM); b.rotation.x=-Math.PI/2; b.rotation.z=Math.PI/2; b.position.set(p,0.03,0); scene.add(b);
  }
  function tex(lit){
    var c=document.createElement('canvas'); c.width=c.height=64; var x=c.getContext('2d');
    x.fillStyle=lit?'#000':'#b8c0dc'; x.fillRect(0,0,64,64);
    for(var a=0;a<4;a++)for(var b=0;b<4;b++){x.fillStyle=lit?(Math.random()<.6?'#ffd27a':'#000'):'#2a3358';x.fillRect(a*16+3,b*16+4,10,8);}
    var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  var tC=tex(false),tE=tex(true),roofM=new THREE.MeshStandardMaterial({color:0x303545}),sideWalkM=new THREE.MeshStandardMaterial({color:0x4a4f5c}),sideWalkG=new THREE.BoxGeometry(10,0.2,10);
  function lit(b,v){b.userData.lit=v;b.material[0].emissiveIntensity=v?1.3:0;}
  function building(x,z,w,d,h,tower){
    var g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv;
    for(var i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*Math.max(w,d)/6,uv.getY(i)*h/6);
    var s=new THREE.MeshStandardMaterial({map:tC,emissiveMap:tE,emissive:0xffffff,emissiveIntensity:0,color:new THREE.Color().setHSL(Math.random(),.2,.75),roughness:.7});
    var m=new THREE.Mesh(g,[s,s,roofM,roofM,s,s]); m.position.set(x,h/2+0.2,z);
    m.userData={kind:'b',lit:false,bump:0,tower:!!tower}; scene.add(m); pick.push(m); blds.push(m); return m;
  }
  for(var i=-3;i<=3;i++)for(var j=-3;j<=3;j++){
    var bx=i*14,bz=j*14,sw=new THREE.Mesh(sideWalkG,sideWalkM); sw.position.set(bx,0.1,bz); sw.userData.kind='ground'; scene.add(sw); pick.push(sw);
    if(!i&&!j){building(0,0,5,5,48,true);continue;}
    var mh=Math.max(3,22-Math.hypot(i,j)*4);
    for(var k=0;k<4;k++){
      var w=3.2+Math.random()*1.2,d=3.2+Math.random()*1.2;
      building(bx+(k%2?2.5:-2.5),bz+(k<2?2.5:-2.5),w,d,4+Math.random()*mh);
    }
  }
  var ant=new THREE.Mesh(new THREE.SphereGeometry(0.6,12,12),new THREE.MeshBasicMaterial({color:0xff2020}));
  ant.position.set(0,49.2,0); scene.add(ant);

  // سيارات
  var cg=new THREE.BoxGeometry(1.8,0.6,0.9),cg2=new THREE.BoxGeometry(1,0.45,0.8),cm=new THREE.MeshStandardMaterial({color:0x222222});
  for(var n=0;n<26;n++){
    var g=new THREE.Group(),body=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.8,.5)})),cab=new THREE.Mesh(cg2,cm);
    body.position.y=0.5; cab.position.set(-0.1,0.95,0); g.add(body,cab);
    g.userData={kind:'car',body:body,axis:n%2,line:(Math.floor(Math.random()*8)-4)*14+7,dir:Math.random()<.5?1:-1,pos:Math.random()*100-50,speed:5+Math.random()*5,jump:0};
    scene.add(g); pick.push(g); cars.push(g);
  }

  // نجوم (ليلاً)
  var sp=new Float32Array(1200*3);
  for(var i=0;i<1200;i++){var r=110+Math.random()*30,a=Math.random()*6.283,b=Math.acos(Math.random()*1.8-0.9);
    sp[i*3]=r*Math.sin(b)*Math.cos(a);sp[i*3+1]=Math.abs(r*Math.cos(b))+2;sp[i*3+2]=r*Math.sin(b)*Math.sin(a);}
  var sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  var stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.6,fog:false})); stars.visible=false; scene.add(stars);

  var night=false;
  function setNight(n){night=n;var c=n?0x050816:0x7ec8ff;scene.background.set(c);scene.fog.color.set(c);hemi.intensity=n?0.35:1;sun.intensity=n?0.2:0.9;stars.visible=n;blds.forEach(function(b){lit(b,n);});}
  document.getElementById('dn2').onclick=function(){setNight(!night);};

  // ---------- التفاعل ----------
  var ac;
  function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d);}catch(e){}}
  function fire(p){
    var n=90,pos=new Float32Array(n*3),vel=[];
    for(var i=0;i<n;i++){pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;vel.push(new V3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(6+Math.random()*4));}
    var g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    var pt=new THREE.Points(g,new THREE.PointsMaterial({color:new THREE.Color().setHSL(Math.random(),1,.6),size:0.8,transparent:true,fog:false}));
    scene.add(pt); fws.push({pt:pt,vel:vel,t:0}); beep(120,.3);
  }
  function ball(p){
    var m=new THREE.Mesh(new THREE.SphereGeometry(0.4,16,12),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.9,.55)}));
    m.position.copy(p); m.position.y+=0.6; m.userData={kind:'ball',v:new V3((Math.random()-.5)*3,6,(Math.random()-.5)*3)};
    scene.add(m); pick.push(m); balls.push(m);
    if(balls.length>30){var o=balls.shift();scene.remove(o);pick.splice(pick.indexOf(o),1);}
    beep(520,.1);
  }
  var rc=new THREE.Raycaster(); rc.far=250;
  function interact(){
    var h=rc.intersectObjects(pick,true)[0];
    if(!h){fire(rc.ray.origin.clone().addScaledVector(rc.ray.direction,50));return;}
    var o=h.object; while(o&&!o.userData.kind)o=o.parent; if(!o)return;
    var k=o.userData.kind;
    if(k==='b'){lit(o,!o.userData.lit);o.userData.bump=1;beep(o.userData.lit?660:330,.15);if(o.userData.tower)fire(new V3(0,52,0));}
    else if(k==='car'){o.userData.jump=1;o.userData.body.material.color.setHSL(Math.random(),.8,.5);beep(280+Math.random()*80,.45);}
    else if(k==='ball'){o.userData.v.copy(rc.ray.direction).multiplyScalar(9);o.userData.v.y=7;beep(700,.08);}
    else ball(h.point);
  }
  // XR: أذرع التحكم
  [0,1].forEach(function(i){
    var c=renderer.xr.getController(i);
    c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(),new V3(0,0,-8)]),new THREE.LineBasicMaterial({color:0x5b6cff})));
    c.addEventListener('selectstart',function(){
      c.updateMatrixWorld(true);
      rc.ray.origin.setFromMatrixPosition(c.matrixWorld);
      rc.ray.direction.set(0,0,-1).applyMatrix4(new THREE.Matrix4().extractRotation(c.matrixWorld));
      interact();
    });
    rig.add(c);
  });

  // ---------- التحكم ----------
  var yaw=0,pitch=0,drag=false,dragId=-1,lx=0,ly=0,useGyro=false,dev={a:0,b:0,g:0},orient=0,down=null,stereo=false;
  canvas.addEventListener('pointerdown',function(e){drag=true;dragId=e.pointerId;lx=e.clientX;ly=e.clientY;down={x:e.clientX,y:e.clientY,t:performance.now()};});
  addEventListener('pointerup',function(e){
    if(e.pointerId!==dragId)return; drag=false;
    if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<450&&!renderer.xr.isPresenting){
      camera.updateMatrixWorld(true);
      rc.setFromCamera(stereo?{x:0,y:0}:{x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},camera);
      interact();
    }
    down=null;
  });
  addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==dragId)return;
    yaw-=(e.clientX-lx)*0.005;
    if(!useGyro)pitch=Math.max(-1.4,Math.min(1.4,pitch-(e.clientY-ly)*0.005));
    lx=e.clientX;ly=e.clientY;
  });
  var joy={x:0,y:0},vert=0,joyEl=document.getElementById('joy'),knob=document.getElementById('knob'),jid=null;
  if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
  function jmove(e){var r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width/2-10,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l;}joy.x=dx/m;joy.y=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)';}
  joyEl.addEventListener('pointerdown',function(e){jid=e.pointerId;joyEl.setPointerCapture(e.pointerId);jmove(e);});
  joyEl.addEventListener('pointermove',function(e){if(e.pointerId===jid)jmove(e);});
  function jend(e){if(e.pointerId!==jid)return;jid=null;joy.x=joy.y=0;knob.style.transform='';}
  joyEl.addEventListener('pointerup',jend);joyEl.addEventListener('pointercancel',jend);
  function hold(id,v){var b=document.getElementById(id);b.addEventListener('pointerdown',function(e){vert=v;b.setPointerCapture(e.pointerId);});['pointerup','pointercancel'].forEach(function(n){b.addEventListener(n,function(){vert=0;});});}
  hold('up',1);hold('dn',-1);
  var keys={};
  addEventListener('keydown',function(e){keys[e.code]=true;});
  addEventListener('keyup',function(e){keys[e.code]=false;});

  var q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)),eu=new THREE.Euler(),zee=new V3(0,0,1);
  function onOrient(e){if(e.alpha!==null&&e.alpha!==undefined){dev.a=e.alpha;dev.b=e.beta;dev.g=e.gamma;useGyro=true;}}
  function onScreen(){orient=(screen.orientation&&screen.orientation.angle)||window.orientation||0;}
  addEventListener('orientationchange',onScreen); onScreen();
  function msg(t){document.getElementById('msg').textContent=t;}
  function enableGyro(){
    var D=window.DeviceOrientationEvent;
    if(!D){msg('الجيروسكوب غير مدعوم هنا');return;}
    var go=function(){addEventListener('deviceorientation',onOrient);msg('تم تفعيل الجيروسكوب — حرّك جهازك');};
    if(typeof D.requestPermission==='function')D.requestPermission().then(function(r){if(r==='granted')go();else msg('تم رفض إذن الحركة');}).catch(function(){msg('تعذّر طلب الإذن');});
    else go();
  }
  document.getElementById('gy').onclick=enableGyro;

  var sc=new THREE.StereoCamera(); sc.aspect=0.5;
  function setStereo(on){
    stereo=on; document.body.classList.toggle('stereo',on); resize();
    if(on){
      enableGyro();
      var el=document.documentElement; if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
      if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});
    }else{
      if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
      if(screen.orientation&&screen.orientation.unlock)try{screen.orientation.unlock();}catch(e){}
    }
  }
  document.getElementById('cb').onclick=function(){setStereo(true);};
  document.getElementById('exit').onclick=function(){setStereo(false);};

  var xrBtn=document.getElementById('xr');
  if(navigator.xr&&navigator.xr.isSessionSupported){
    navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
      if(!ok)return;
      xrBtn.style.display='';
      xrBtn.onclick=function(){
        if(renderer.xr.isPresenting){var s=renderer.xr.getSession();if(s)s.end();return;}
        navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']}).then(function(s){
          renderer.xr.setReferenceSpaceType('local-floor');
          renderer.xr.setSession(s);
          camera.position.set(0,0,0);
          document.getElementById('xrt').textContent='خروج من VR';
          s.addEventListener('end',function(){camera.position.set(0,1.6,0);document.getElementById('xrt').textContent='دخول VR';});
        }).catch(function(){msg('تعذّر بدء جلسة VR');});
      };
    }).catch(function(){});
  }

  function resize(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    camera.aspect=(stereo?w/2:w)/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize); resize();

  // ---------- الحلقة ----------
  var lastT=performance.now(),tv=new V3();
  renderer.setAnimationLoop(function(){
    var now=performance.now(),dt=Math.min((now-lastT)/1000,0.1),t=now/1000; lastT=now;
    // سيارات
    cars.forEach(function(c){
      var u=c.userData; u.pos+=u.dir*u.speed*dt; if(u.pos>55)u.pos=-55; if(u.pos<-55)u.pos=55;
      if(u.axis===0){c.position.set(u.pos,0,u.line+u.dir);c.rotation.y=u.dir>0?0:Math.PI;}
      else{c.position.set(u.line-u.dir,0,u.pos);c.rotation.y=u.dir>0?-Math.PI/2:Math.PI/2;}
      if(u.jump>0){u.jump-=dt*1.5;c.position.y=Math.sin(Math.max(u.jump,0)*Math.PI)*0.8;}
    });
    // مبانٍ
    blds.forEach(function(b){var u=b.userData;if(u.bump>0){u.bump=Math.max(0,u.bump-dt*2);var s=1+Math.sin(u.bump*18)*0.05*u.bump;b.scale.set(s,1,s);}});
    ant.material.color.setHex(Math.sin(t*4)>0?0xff2020:0x440000);
    // كرات
    balls.forEach(function(m){var v=m.userData.v;v.y-=15*dt;m.position.addScaledVector(v,dt);
      if(m.position.y<0.4){m.position.y=0.4;v.y*=-0.6;v.x*=0.85;v.z*=0.85;if(Math.abs(v.y)<0.6)v.y=0;}});
    // ألعاب نارية
    for(var i=fws.length-1;i>=0;i--){
      var f=fws[i],a=f.pt.geometry.attributes.position; f.t+=dt;
      for(var k=0;k<f.vel.length;k++){var v=f.vel[k];v.y-=6*dt;a.setXYZ(k,a.getX(k)+v.x*dt,a.getY(k)+v.y*dt,a.getZ(k)+v.z*dt);}
      a.needsUpdate=true; f.pt.material.opacity=Math.max(0,1-f.t/2);
      if(f.t>2){scene.remove(f.pt);f.pt.geometry.dispose();f.pt.material.dispose();fws.splice(i,1);}
    }
    // رؤية
    var pr=renderer.xr.isPresenting;
    if(!pr){
      if(useGyro){
        eu.set(THREE.MathUtils.degToRad(dev.b),THREE.MathUtils.degToRad(dev.a),-THREE.MathUtils.degToRad(dev.g),'YXZ');
        camera.quaternion.setFromEuler(eu); camera.quaternion.multiply(q1);
        camera.quaternion.multiply(q0.setFromAxisAngle(zee,-THREE.MathUtils.degToRad(orient)));
      }else camera.rotation.set(pitch,0,0);
    }
    // حركة 6DoF
    var f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,
        s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,
        u=(keys.KeyE||keys.Space?1:0)-(keys.KeyQ||keys.ShiftLeft?1:0)+vert;
    var ss=pr&&renderer.xr.getSession();
    if(ss)ss.inputSources.forEach(function(src){var g=src.gamepad;if(!g||g.axes.length<4)return;
      if(src.handedness==='right'){yaw-=g.axes[2]*0.03;u-=g.axes[3];}else{s+=g.axes[2];f-=g.axes[3];}});
    if(f||s||u){
      camera.getWorldDirection(tv);tv.y=0;if(tv.lengthSq()<1e-4)tv.set(0,0,-1);tv.normalize();
      var sp2=6*dt;
      rig.position.x+=(tv.x*f-tv.z*s)*sp2;
      rig.position.z+=(tv.z*f+tv.x*s)*sp2;
      rig.position.y=Math.max(pr?0:-1.2,rig.position.y+u*sp2);
    }
    rig.rotation.y=yaw;
    // رسم
    if(stereo&&!pr){
      var w=innerWidth,h=innerHeight;
      camera.updateMatrixWorld(); sc.update(camera); sc.eyeSep=0.064;
      renderer.setScissorTest(true);
      renderer.setScissor(0,0,w/2,h);renderer.setViewport(0,0,w/2,h);renderer.render(scene,sc.cameraL);
      renderer.setScissor(w/2,0,w/2,h);renderer.setViewport(w/2,0,w/2,h);renderer.render(scene,sc.cameraR);
      renderer.setScissorTest(false);
    }else{
      if(!pr)renderer.setViewport(0,0,innerWidth,innerHeight);
      renderer.render(scene,camera);
    }
  });
})();
</script>
